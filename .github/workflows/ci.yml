name: static checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test utilities
        run: sudo apt-get update && sudo apt-get install -y jq lua5.4
      - name: Run headless checks
        run: sh tools/check-static.sh
