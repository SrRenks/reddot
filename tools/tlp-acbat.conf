# AC/BAT policy for this ThinkPad E14. This is a drop-in for /etc/tlp.d.
#
# AC and battery deliberately share balanced + powersave + balance_power. The
# embedded controller does not limit sustained power by source (measured within
# 4%), so the profile is an efficiency choice, not an AC boost.
#
# Measured on this EC, 16 threads:
#   performance: 14.2 W idle, 35.8 W load, 87 C, 18.4 MB/s
#   balanced:     5.9 W idle, 15.1 W load, 67 C, 11.9 MB/s
#   power-saver:  5.0 W idle, 10.1 W load, 54 C,  7.1 MB/s
#
# Performance is an explicit, temporary override, never a resting policy.
# The battery penalty is real: 93 C on one thread in performance. The helper
# refuses performance on battery.
#
# _ON_SAV is the emergency setting. It costs 1.68x throughput for 0.9 W when
# compared with AC power-saver, so it is not the default on battery.
PLATFORM_PROFILE_ON_AC=balanced
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_power

PLATFORM_PROFILE_ON_BAT=balanced
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

PLATFORM_PROFILE_ON_SAV=low-power
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_ENERGY_PERF_POLICY_ON_SAV=power
