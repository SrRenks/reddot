# reddot AC/BAT power shape (drop-in, overrides /etc/tlp.conf).
#
#   AC      -> performance platform profile, performance EPP (from tlp.conf)
#   battery -> balanced platform profile, powersave governor + balance_power EPP
#   saver   -> low-power platform profile, power EPP (manual `tlp power-saver`)
#
# The AC/BAT governor and EPP lines already exist in /etc/tlp.conf; they are
# repeated here so the whole policy is visible in one file.
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave

CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
